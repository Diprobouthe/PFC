name: New player onboarding regression

on:
  push:
    branches:
      - fix/new-player-skip-legacy-link-20261013

permissions:
  contents: read

jobs:
  focused-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pfc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pfc_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/pfc_test
      SECRET_KEY: onboarding-branch-test-secret
      DEBUG: "False"
      GOOGLE_OAUTH_CLIENT_ID: test-client
      GOOGLE_OAUTH_CLIENT_SECRET: test-secret
      GOOGLE_OAUTH_REDIRECT_URI: http://testserver/player-auth/google/callback/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - name: Run onboarding regression tests
        run: python manage.py test player_auth.test_new_player_onboarding --verbosity 2
