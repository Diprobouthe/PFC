name: Team scenarios + VS regression (isolated)

on:
  push:
    branches:
      - test/team-vs-scenarios-regression-20261016
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-django-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pfc_branch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pfc_branch_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/pfc_branch_test
      SECRET_KEY: isolated-tests-not-for-production
      DEBUG: "False"
      TOURNAMENT_LINEUP_CLOCK_ENABLED: "false"
    steps:
      - name: Checkout isolated test branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Django project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Django system checks
        run: python manage.py check
      - name: Verify additive migrations match models
        run: python manage.py makemigrations --check --dry-run
      - name: Team/VS focused regression
        run: |
          set -o pipefail
          python manage.py test tournaments.test_team_vs_scenarios_regression --verbosity 2 2>&1 | tee team-vs-regression.log
      - name: CEP Final Four feature and tournament history regression
        if: always()
        run: |
          set -o pipefail
          python manage.py test \
            tournaments.test_eight_team_final_four_diagnostics.EightTeamTournamentDiagnosticTests.test_swiss_8_to_4_semifinals_final_and_champion_ranked_first \
            tournaments.test_eight_team_final_four_diagnostics.EightTeamTournamentDiagnosticTests.test_optional_bronze_match_finalizes_only_after_both_finals \
            tournaments.test_player_tournament_history \
            --verbosity 2 2>&1 | tee cep-final-four.log
      - name: Eight-team Swiss Final Four and ordinary Knockout diagnostics
        if: always()
        run: |
          set -o pipefail
          python manage.py test tournaments.test_eight_team_final_four_diagnostics --verbosity 2 2>&1 | tee eight-team-diagnostics.log
      - name: P4 Melee and Super Melee isolation regression
        if: always()
        run: |
          set -o pipefail
          python manage.py test tournaments.test_melee_p4_write_cutover tournaments.test_melee_assignment_writer matches.test_melee_round_assignment_consumers --verbosity 2 2>&1 | tee p4-isolation-regression.log
      - name: Archive output for investigation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: team-vs-regression-results
          path: |
            team-vs-regression.log
            eight-team-diagnostics.log
            cep-final-four.log
            p4-isolation-regression.log
          if-no-files-found: ignore
