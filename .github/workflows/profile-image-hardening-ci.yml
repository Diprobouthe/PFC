name: Profile image hardening CI

on:
  push:
    branches:
      - hardening/profile-image-uploads-20261007

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Django checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Image hardening tests
        run: |
          python manage.py test teams.test_profile_image_hardening teams.test_avatar_thumbnails
