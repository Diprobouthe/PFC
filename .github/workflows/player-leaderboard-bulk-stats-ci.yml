name: Player leaderboard bulk stats CI

on:
  push:
    branches:
      - perf/player-leaderboard-bulk-stats-20261008

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Django checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Leaderboard performance regression tests
        run: |
          python manage.py test teams.test_player_leaderboard_bulk_stats teams.test_avatar_thumbnails teams.test_profile_image_hardening
