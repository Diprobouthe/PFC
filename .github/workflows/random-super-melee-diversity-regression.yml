name: Random Super Melee diversity regression

on:
  push:
    branches:
      - fix/random-super-melee-diversity-20261012

permissions:
  contents: read

jobs:
  focused-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pfc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pfc_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/pfc_test
      SECRET_KEY: branch-test-secret
      DEBUG: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - name: Run Random diversity plus Snake doubles guard suites
        run: |
          python manage.py test             tournaments.test_random_super_melee_diversity             tournaments.test_snake_draft_bye_fairness             tournaments.test_snake_draft_odd_byes             tournaments.test_melee_assignment_writer             --verbosity 2
