name: Temporary Friendly final-result broad regression test

on:
  push:
    branches:
      - fix/friendly-final-result-qr-identity

jobs:
  friendly-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Friendly and score authorization regressions
        run: >
          python manage.py test
          friendly_games.tests
          matches.test_tournament_starting_team.TournamentStartingTeamTests.test_tournament_score_update_uses_trusted_session_not_json_codename
          --verbosity 1
