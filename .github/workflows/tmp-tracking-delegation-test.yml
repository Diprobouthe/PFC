name: Temporary Match Tracking delegation test

on:
  push:
    branches:
      - fix/tracking-browser-delegation

jobs:
  targeted-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run targeted regression tests
        run: >
          python manage.py test
          match_tracking.tests.MatchTrackingBrowserDelegationTests
          matches.test_tournament_starting_team.TournamentStartingTeamTests.test_tournament_score_update_uses_trusted_session_not_json_codename
          --verbosity 2
