name: Player profile memory repeat probe

on:
  push:
    branches:
      - test/player-profile-memory-repeat-20261012

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Hit player 1 profile 10 times
        shell: bash
        run: |
          python - <<'PY'
          import time
          from urllib.request import Request, urlopen

          url="https://pfc-e1ce.onrender.com/teams/players/1/"
          for i in range(1, 11):
              started=time.time()
              req=Request(url, headers={"User-Agent":"PFC-Player1-Memory-Probe/1.0"})
              with urlopen(req, timeout=30) as r:
                  body=r.read()
                  elapsed=time.time()-started
                  print(f"HIT {i}: status={r.status} bytes={len(body)} elapsed={elapsed:.3f}s", flush=True)
              if i < 10:
                  time.sleep(30)
          print("DONE; cooling 120s", flush=True)
          time.sleep(120)
          PY
