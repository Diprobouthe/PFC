name: Simple Creator scheduling regression

on:
  push:
    branches:
      - fix/friendly-billboard-presence-20261115
    paths:
      - pfc_core/simple_creator.py
      - templates/simple_creator.html
      - pfc_core/tests/test_simple_creator_schedule.py
      - pfc_core/tests/test_scenario_tournament_naming.py
      - .github/workflows/simple-creator-scheduling-regression.yml
  pull_request:
    branches:
      - main
    paths:
      - pfc_core/simple_creator.py
      - templates/simple_creator.html
      - pfc_core/tests/test_simple_creator_schedule.py
      - pfc_core/tests/test_scenario_tournament_naming.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pfc_schedule_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pfc_schedule_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/pfc_schedule_test
      REDIS_URL: redis://127.0.0.1:6379/0
      SECRET_KEY: isolated-schedule-regression-not-production
      DEBUG: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py test pfc_core.tests.test_simple_creator_schedule pfc_core.tests.test_scenario_tournament_naming pfc_core.tests.test_simple_tournament_registration_removal --verbosity 2
