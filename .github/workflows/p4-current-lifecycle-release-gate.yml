name: P4 current activation and QR release gate

on:
  push:
    branches:
      - test/p4-current-lineup-qr-regression-20261016
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p4-current-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pfc_p4_current_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pfc_p4_current_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/pfc_p4_current_test
      SECRET_KEY: p4-test-only-not-for-production
      DEBUG: "False"
      TOURNAMENT_LINEUP_CLOCK_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check Django and migrations
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: P4 assignment, current Round activation, QR result validation and transition regression
        run: |
          python manage.py test \
            tournaments.test_melee_p4_write_cutover \
            tournaments.test_melee_assignment_writer \
            matches.test_melee_round_assignment_consumers \
            --verbosity 2
