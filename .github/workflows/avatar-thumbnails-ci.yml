name: Avatar thumbnails CI

on:
  push:
    branches:
      - perf/profile-avatar-thumbnails-20261003

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Django checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Avatar regression tests
        run: python manage.py test teams.test_avatar_thumbnails teams.tests
