name: PETA Certified Entity + PostgreSQL two-event integration

on:
  pull_request:
    branches: [main]
    paths:
      - cert_ratings/peta_core.py
      - cert_ratings/peta_series.py
      - cert_ratings/peta_policy.py
      - cert_ratings/peta_service.py
      - cert_ratings/peta_models.py
      - cert_ratings/models.py
      - cert_ratings/processor.py
      - cert_ratings/migrations/0002_peta_algorithm.py
      - tournaments/models.py
      - matches/lifecycle.py
      - cert_ratings/test_peta_django.py
      - cert_ratings/test_peta_full_snake.py
      - cert_ratings/test_peta_twenty_players.py
      - cert_ratings/test_peta_core.py
      - cert_ratings/test_peta_two_events.py
      - .github/workflows/peta-core-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  peta-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pfc_peta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pfc_peta_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/pfc_peta_test
      SECRET_KEY: isolated-peta-ci-not-production
      DEBUG: "False"
      TOURNAMENT_LINEUP_CLOCK_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Existing Django consistency checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: PETA core, two synthetic events and two PostgreSQL events
        run: |
          python manage.py test \
            cert_ratings.test_peta_core \
            cert_ratings.test_peta_two_events \
            cert_ratings.test_peta_django \
            cert_ratings.test_peta_full_snake \
            cert_ratings.test_peta_twenty_players \
            --verbosity 2
